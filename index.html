<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Executive Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        input, select { background-color: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 6px; outline: none; width: 100%; }
        input:focus { border-color: #d4af37; }
        .table-header { background-color: #0d1117; color: #8b949e; text-transform: uppercase; font-size: 0.75rem; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold gold-text tracking-tighter uppercase">AKUDON COSMETICS</h1>
        <p class="text-gray-500 text-sm">Official Inventory & Sales Terminal</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
        <div class="card p-4 border-b-4 border-yellow-500 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Stock (₦)</h3>
            <p id="total-naira" class="text-2xl font-bold font-mono">₦0</p>
        </div>
        <div class="card p-4 border-b-4 border-yellow-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Stock (CFA)</h3>
            <p id="total-cfa" class="text-2xl font-bold font-mono">0 CFA</p>
        </div>
        <div class="card p-4 border-b-4 border-green-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Revenue (CFA)</h3>
            <p id="expected-cfa" class="text-2xl font-bold font-mono text-green-400">0 CFA</p>
        </div>
        <div class="card p-4 border-b-4 border-red-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Total Debt</h3>
            <p id="total-debt" class="text-2xl font-bold font-mono text-red-400">0 CFA</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            
            <section class="card p-6 shadow-2xl">
                <h2 id="p-title" class="text-xl font-bold gold-text mb-4">📦 Stock Entry</h2>
                <div class="space-y-3">
                    <input type="text" id="p-batch" placeholder="Batch Name">
                    <input type="text" id="p-name" placeholder="Product Name">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-dozens" placeholder="Qty (Doz)" step="0.1">
                        <input type="number" id="p-naira" placeholder="Price ₦">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-cfa" placeholder="Cost CFA">
                        <input type="number" id="p-sell" placeholder="Sell CFA">
                    </div>
                    <button onclick="saveProduct()" class="w-full gold-bg text-black font-bold py-3 rounded-lg uppercase tracking-widest">Save Product</button>
                    <button id="p-cancel" onclick="clearProductForm()" class="hidden w-full bg-gray-800 text-xs py-2 rounded">Cancel Edit</button>
                </div>
            </section>

            <section class="card p-6 shadow-2xl border-t-4 border-green-600">
                <h2 class="text-xl font-bold text-green-500 mb-4">💸 Sale Recording</h2>
                <div class="space-y-3">
                    <input list="p-list" id="sale-prod" placeholder="Select Product">
                    <datalist id="p-list"></datalist>
                    <input type="number" id="sale-qty" placeholder="Quantity to sell">
                    <button onclick="addToQueue()" class="w-full bg-green-700 text-white font-bold py-2 rounded text-sm uppercase">Add to Sale Queue</button>
                    
                    <div id="sale-queue" class="bg-black p-3 rounded text-xs text-gray-400 min-h-[50px] border border-gray-800">
                        Queue empty...
                    </div>

                    <hr class="border-gray-800 my-2">
                    
                    <input type="text" id="c-name" placeholder="Customer Name">
                    <input type="text" id="c-phone" placeholder="Phone Number">
                    <input type="number" id="c-paid" placeholder="Amount Paid (CFA)">
                    
                    <button onclick="saveCustomer()" class="w-full border border-green-500 text-green-500 font-bold py-3 rounded-lg uppercase tracking-widest hover:bg-green-500 hover:text-black transition">Complete Transaction</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-8 space-y-8">
            <div class="card overflow-hidden">
                <h2 class="p-4 font-bold text-sm gold-text border-b border-gray-800 uppercase">Customer Ledger</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="table-header">
                            <tr>
                                <th class="p-4">Customer / Contact</th>
                                <th class="p-4 text-right">Total</th>
                                <th class="p-4 text-right">Balance</th>
                                <th class="p-4 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="card overflow-hidden">
                <h2 class="p-4 font-bold text-sm gold-text border-b border-gray-800 uppercase">Inventory Stock</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="table-header">
                            <tr>
                                <th class="p-4">Batch/Product</th>
                                <th class="p-4">Stock</th>
                                <th class="p-4 text-right">Price</th>
                                <th class="p-4 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
