<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Executive Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        input { background-color: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 6px; outline: none; }
        input:focus { border-color: #d4af37; }
        .table-header { background-color: #0d1117; color: #8b949e; text-transform: uppercase; font-size: 0.75rem; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold gold-text tracking-tighter uppercase">AKUDON COSMETICS</h1>
        <p class="text-gray-500 text-sm">Official Inventory & Sales Terminal</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
        <div class="card p-4 border-b-4 border-yellow-500 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Stock (₦)</h3>
            <p id="total-naira" class="text-2xl font-bold font-mono">₦0</p>
        </div>
        <div class="card p-4 border-b-4 border-yellow-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Stock (CFA)</h3>
            <p id="total-cfa" class="text-2xl font-bold font-mono">0 CFA</p>
        </div>
        <div class="card p-4 border-b-4 border-green-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Revenue (CFA)</h3>
            <p id="expected-cfa" class="text-2xl font-bold font-mono text-green-400">0 CFA</p>
        </div>
        <div class="card p-4 border-b-4 border-red-600 text-center">
            <h3 class="text-xs text-gray-400 uppercase mb-1">Total Debt</h3>
            <p id="total-debt" class="text-2xl font-bold font-mono text-red-400">0 CFA</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4">
            <section class="card p-6 shadow-2xl">
                <h2 id="p-title" class="text-xl font-bold gold-text mb-6 flex items-center">📦 Stock Entry</h2>
                <div class="flex flex-col space-y-4">
                    <input type="text" id="p-batch" placeholder="Batch Name">
                    <input type="text" id="p-name" placeholder="Product Name">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col"><label class="text-xs text-gray-500 mb-1">Qty (Doz)</label><input type="number" id="p-dozens" step="0.1"></div>
                        <div class="flex flex-col"><label class="text-xs text-gray-500 mb-1">Price ₦</label><input type="number" id="p-naira"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col"><label class="text-xs text-gray-500 mb-1">Cost CFA</label><input type="number" id="p-cfa"></div>
                        <div class="flex flex-col"><label class="text-xs text-gray-500 mb-1">Sell CFA</label><input type="number" id="p-sell"></div>
                    </div>
                    <button onclick="saveProduct()" class="w-full gold-bg text-black font-extrabold py-4 rounded-lg hover:opacity-90 transition transform active:scale-95 uppercase tracking-widest">Save Product</button>
                    <button id="p-cancel" onclick="clearProductForm()" class="hidden w-full bg-gray-800 text-sm py-2 rounded mt-2">Cancel Edit</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-8 space-y-8">
            <div class="card overflow-hidden">
                <h2 class="p-4 font-bold text-sm gold-text border-b border-gray-800 uppercase tracking-widest">Customer Ledger</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="table-header">
                            <tr>
                                <th class="p-4">Customer/Items</th>
                                <th class="p-4 text-right">Total</th>
                                <th class="p-4 text-right">Balance</th>
                                <th class="p-4 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="card overflow-hidden">
                <h2 class="p-4 font-bold text-sm gold-text border-b border-gray-800 uppercase tracking-widest">Inventory Stock</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="table-header">
                            <tr>
                                <th class="p-4">Batch/Product</th>
                                <th class="p-4">Stock</th>
                                <th class="p-4 text-right">Price</th>
                                <th class="p-4 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
