<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Executive Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #e5e7eb; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="text-center mb-10">
        <h1 class="text-3xl font-bold gold-text tracking-widest uppercase">AkuDon Cosmetics</h1>
        <p class="text-gray-500 text-sm">Professional Inventory & Sales Terminal</p>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="bg-zinc-900 p-4 rounded-xl border-t-4 gold-border shadow-lg">
            <h3 class="text-xs text-gray-400 uppercase">Stock Value (₦)</h3>
            <p id="total-naira" class="text-xl font-bold text-white">₦0</p>
        </div>
        <div class="bg-zinc-900 p-4 rounded-xl border-t-4 gold-border shadow-lg">
            <h3 class="text-xs text-gray-400 uppercase">Stock Value (CFA)</h3>
            <p id="total-cfa" class="text-xl font-bold text-white">0 CFA</p>
        </div>
        <div class="bg-zinc-900 p-4 rounded-xl border-t-4 border-green-600 shadow-lg">
            <h3 class="text-xs text-gray-400 uppercase">Expected Sales</h3>
            <p id="expected-cfa" class="text-xl font-bold text-green-500">0 CFA</p>
        </div>
        <div class="bg-zinc-900 p-4 rounded-xl border-t-4 border-red-600 shadow-lg">
            <h3 class="text-xs text-gray-400 uppercase">Total Debt</h3>
            <p id="total-debt" class="text-xl font-bold text-red-500">0 CFA</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <section class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                <h2 id="p-form-title" class="text-lg font-bold gold-text mb-4">📦 Add/Edit Stock</h2>
                <div class="space-y-3">
                    <input type="text" id="p-batch" placeholder="Batch Name" class="w-full bg-zinc-800 p-3 rounded-lg border border-zinc-700 outline-none focus:ring-1 ring-yellow-600">
                    <input type="text" id="p-name" placeholder="Product Name" class="w-full bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-dozens" placeholder="Dozens" class="bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                        <input type="number" id="p-naira" placeholder="Price (₦)" class="bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-cfa" placeholder="Cost (CFA)" class="bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                        <input type="number" id="p-sell" placeholder="Sell (CFA)" class="bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    </div>
                    <button onclick="saveProduct()" class="w-full gold-bg text-black font-bold py-3 rounded-lg hover:opacity-90">SAVE TO INVENTORY</button>
                    <button id="cancel-edit-btn" onclick="clearProductForm()" class="hidden w-full bg-zinc-700 text-white font-bold py-2 rounded-lg mt-2">Cancel Edit</button>
                </div>
            </section>

            <section class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                <h2 class="text-lg font-bold text-green-500 mb-4">👤 New Sale</h2>
                <div class="space-y-3">
                    <input type="text" id="c-name" placeholder="Customer Name" class="w-full bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    <input type="text" id="c-phone" placeholder="Phone Number" class="w-full bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    
                    <div class="p-3 bg-black rounded-lg border border-zinc-700">
                        <input list="inventory-list" id="sale-item" placeholder="Search Product..." class="w-full bg-transparent mb-2 outline-none gold-text" onchange="autoFillSalePrice()">
                        <datalist id="inventory-list"></datalist>
                        <div class="flex gap-2">
                            <input type="number" id="sale-qty" placeholder="Doz" class="w-1/2 bg-zinc-800 p-2 rounded">
                            <button onclick="addToQueue()" class="w-1/2 bg-zinc-700 font-bold rounded text-xs">+ Add Item</button>
                        </div>
                    </div>
                    <div id="sale-queue" class="text-xs space-y-1 p-2 bg-zinc-950 rounded border border-zinc-800 min-h-[40px]"></div>
                    <input type="number" id="c-paid" placeholder="Amount Paid (CFA)" class="w-full bg-zinc-800 p-3 rounded-lg border border-zinc-700">
                    <button onclick="saveCustomer()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">POST TRANSACTION</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-8 space-y-6">
            <div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden">
                <div class="p-4 bg-zinc-800/50">
                    <h2 class="font-bold">Customer Ledger</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-black text-gray-400">
                            <tr>
                                <th class="p-4">Customer</th>
                                <th class="p-4">Items</th>
                                <th class="p-4 text-right">Total</th>
                                <th class="p-4 text-right">Balance</th>
                                <th class="p-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden">
                <div class="p-4 bg-zinc-800/50">
                    <h2 class="font-bold">Live Inventory</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-black text-gray-400">
                            <tr>
                                <th class="p-4">Batch</th>
                                <th class="p-4">Product</th>
                                <th class="p-4">Stock</th>
                                <th class="p-4 text-right">CFA Selling</th>
                                <th class="p-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
