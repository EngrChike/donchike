<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Executive Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --text-light: #e0e0e0;
            --danger: #ff4444;
            --success: #00c853;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--dark-bg); color: var(--text-light); margin: 0; padding: 20px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--primary-gold); margin-bottom: 30px; }
        .header h1 { margin: 0; color: var(--primary-gold); letter-spacing: 4px; text-transform: uppercase; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border-top: 3px solid var(--primary-gold); text-align: center; }
        .stat-card p { margin: 10px 0 0; font-size: 1.6rem; font-weight: 700; }

        .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 30px; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

        .form-section { background: var(--card-bg); padding: 25px; border-radius: 16px; height: fit-content; position: sticky; top: 20px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--input-bg); border: 1px solid #333; border-radius: 8px; color: white; box-sizing: border-box; }
        
        .btn-save { background: var(--primary-gold); color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-edit { background: #64748b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-del { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        .table-section { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 12px; color: var(--primary-gold); border-bottom: 2px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }

        .low-stock { color: var(--danger); font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }
        .badge { background: #333; padding: 3px 7px; border-radius: 4px; color: var(--primary-gold); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="header"><h1>AKUDON COSMETICS</h1></div>

    <div class="dashboard">
        <div class="stat-card"><h3>Supply Cost</h3><p id="dash-naira">₦0</p></div>
        <div class="stat-card"><h3>Exp. Revenue</h3><p id="dash-cfa" style="color:var(--success)">0 CFA</p></div>
        <div class="stat-card"><h3>Total Debt</h3><p id="dash-debt" style="color:var(--danger)">0 CFA</p></div>
    </div>

    <div class="main-grid">
        <div class="form-section">
            <h2 id="product-form-title" style="color: var(--primary-gold); margin-top:0;">Stock Entry</h2>
            <input type="text" id="p-batch" placeholder="Batch Name">
            <input type="text" id="p-name" placeholder="Product Name">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="p-dozens" step="0.5" placeholder="Total Dozens">
                <input type="number" id="p-sold" step="0.5" placeholder="Sold Units">
            </div>
            <input type="number" id="p-price-naira" placeholder="Cost per Dozen (₦)">
            <input type="number" id="p-sell-cfa" placeholder="Selling Price (CFA)">
            <button class="btn-save" onclick="saveProduct()">SAVE PRODUCT</button>

            <hr style="border: 1px solid #333; margin: 20px 0;">
            
            <h2 id="customer-form-title" style="color: var(--primary-gold);">Customer Ledger</h2>
            <input type="text" id="c-name" placeholder="Customer Name">
            <input type="text" id="c-items" placeholder="Items Bought (e.g. 2 Soap, 1 Cream)">
            <input type="number" id="c-total" placeholder="Total Bill (CFA)">
            <input type="number" id="c-paid" placeholder="Amount Paid (CFA)">
            <button class="btn-save" style="background:#444; color:white;" onclick="saveCustomer()">SAVE TRANSACTION</button>
        </div>

        <div class="content">
            <div class="table-section">
                <h2>Live Inventory</h2>
                <table>
                    <thead><tr><th>Batch</th><th>Product</th><th>Sold</th><th>Balance</th><th>Actions</th></tr></thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
            <div class="table-section">
                <h2>Customer Ledger</h2>
                <table>
                    <thead><tr><th>Customer / Items</th><th>Bill</th><th>Paid</th><th>Balance</th><th>Last Update</th><th>Actions</th></tr></thead>
                    <tbody id="ledger-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
