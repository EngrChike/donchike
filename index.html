<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Cosmetics Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --bg: #0b0b0b; --card: #1a1a1a; --text: #eee; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .grid { grid-template-columns: 380px 1fr; } }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-green { background: #00c853; color: white; }
        .table-wrap { overflow-x: auto; background: var(--card); padding: 15px; border-radius: 12px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; color: var(--gold); border-bottom: 2px solid #333; padding: 10px; font-size: 0.8rem; }
        td { padding: 10px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .stat-box { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--gold); }
    </style>
</head>
<body>
    <h1 style="color:var(--gold); text-align:center;">AKUDON COSMETICS VENTURES</h1>
    
    <div class="grid">
        <div class="panel">
            <h2>Inventory Entry</h2>
            <input type="text" id="p-batch" placeholder="Batch Name">
            <input type="text" id="p-name" placeholder="Product Name">
            <input type="number" id="p-dozens" placeholder="Number of Dozens">
            <input type="number" id="p-naira" placeholder="Price in Naira (₦)">
            <input type="number" id="p-cfa-cost" placeholder="Price in CFA (Cost)">
            <input type="number" id="p-sell-cfa" placeholder="Expected Selling Price (CFA)">
            <button class="btn btn-gold" onclick="saveProduct()">SAVE PRODUCT</button>

            <hr style="margin: 25px 0; border: 0.5px solid #333;">

            <h2>Customer Details</h2>
            <input type="text" id="c-name" placeholder="Customer Name">
            <input type="text" id="c-phone" placeholder="Phone Number">
            <div style="background: #252525; padding: 10px; border-radius: 8px;">
                <input list="prod-list" id="sel-prod" placeholder="Select Product..." onchange="autoFillPrice()">
                <datalist id="prod-list"></datalist>
                <input type="number" id="sel-qty" placeholder="Add Amount of Dozen">
                <input type="number" id="sel-price" placeholder="Price (CFA)">
                <button class="btn" style="background:#444; color:white;" onclick="addToQueue()">+ Add Item to Sale</button>
            </div>
            <div id="item-queue" style="margin: 10px 0; font-size: 0.8rem; color: var(--gold);"></div>
            <input type="number" id="c-paid" placeholder="Amount Paid (CFA)">
            <button class="btn btn-green" onclick="saveCustomer()">SAVE CUSTOMER TRANSACTION</button>
        </div>

        <div>
            <div class="stat-box" id="totals-box">
                <strong>Inventory Value:</strong> ₦0 | 0 CFA <br>
                <strong>Expected Revenue:</strong> 0 CFA
            </div>
            <div class="table-wrap">
                <h3>Customer Ledger</h3>
                <table>
                    <thead><tr><th>Name/Phone</th><th>Items</th><th>Total</th><th>Paid</th><th>Balance</th><th>Last Update</th><th>Actions</th></tr></thead>
                    <tbody id="ledger-body"></tbody>
                </table>
            </div>
            <div class="table-wrap">
                <h3>Product Stock</h3>
                <table>
                    <thead><tr><th>Batch</th><th>Product</th><th>Stock</th><th>Naira</th><th>CFA</th><th>Actions</th></tr></thead>
                    <tbody id="stock-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
