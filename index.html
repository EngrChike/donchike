<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AkuDon Executive Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --bg: #121212; --card: #1e1e1e; --input: #2a2a2a; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding: 15px 0; margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 1.4rem; }
        .grid { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 1024px) { .grid { flex-direction: row; align-items: flex-start; } }
        .card { background: var(--card); padding: 20px; border-radius: 12px; flex: 1; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: var(--input); border: 1px solid #444; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: #00c853; color: #fff; }
        .table-wrap { overflow-x: auto; margin-top: 10px; border-radius: 8px; background: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; min-width: 550px; }
        th { text-align: left; padding: 12px; color: var(--gold); border-bottom: 2px solid #333; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
        .pending-item { background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--gold); display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="header"><h1>AKUDON COSMETICS</h1></div>
    <div class="grid">
        <div class="card" style="max-width: 420px;">
            <h2>Inventory Manager</h2>
            <input type="text" id="p-name" placeholder="Product Name">
            <input type="number" id="p-dozens" step="0.1" placeholder="Dozens (Initial Stock)">
            <input type="number" id="p-sell-cfa" placeholder="Selling Price (CFA)">
            <button class="btn btn-gold" onclick="saveProduct()">SAVE PRODUCT</button>
            <hr style="margin: 30px 0; border: 0.5px solid #333;">
            <h2>New Transaction</h2>
            <input type="text" id="c-name" placeholder="Customer Name">
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <input list="prod-list" id="sel-prod" placeholder="Search Product..." onchange="autoFillPrice()">
                <datalist id="prod-list"></datalist>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="sel-qty" step="0.1" placeholder="Qty">
                    <input type="number" id="sel-price" placeholder="Price (CFA)">
                </div>
                <button class="btn" style="background:#333; color:var(--gold);" onclick="addToList()">+ ADD ITEM</button>
            </div>
            <div id="item-queue"></div>
            <input type="number" id="c-paid" placeholder="Amount Paid (CFA)">
            <button class="btn btn-green" onclick="saveCustomer()">CONFIRM & POST SALE</button>
        </div>
        <div class="card">
            <h2>Customer Ledger</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Customer / Goods</th><th>Debt (CFA)</th><th>Action</th></tr></thead>
                    <tbody id="ledger-body"></tbody>
                </table>
            </div>
            <h2 style="margin-top: 40px;">Current Stock Status</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Product Name</th><th>Stock Level</th><th>Action</th></tr></thead>
                    <tbody id="stock-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
