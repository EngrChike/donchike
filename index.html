<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Batch & Ledger Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --accent: #f59e0b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background-color: var(--background); color: var(--text-main); }
        .navbar { background: var(--surface); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        .container { max-width: 1300px; margin: 2rem auto; padding: 0 1rem; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h3 { margin: 0 0 0.5rem 0; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; }
        .card .value { font-size: 1.5rem; font-weight: 700; margin: 0; }

        .grid-layout { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
        
        .section-header { margin-bottom: 1rem; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; font-weight: 500; color: var(--text-light); }
        input, textarea { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        textarea { height: 60px; resize: none; }
        button { background: var(--primary); color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }

        .table-container { background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f8fafc; color: var(--text-light); font-weight: 600; }
        .batch-badge { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>AkuDon Ledger Pro</h1>
    </nav>

    <div class="container">
        <div class="dashboard">
            <div class="card"><h3>Total Stock Cost</h3><p class="value" id="dash-naira">₦0</p></div>
            <div class="card"><h3>Expected Revenue</h3><p class="value" style="color:var(--success)" id="dash-cfa">0 CFA</p></div>
            <div class="card"><h3>Outstanding Debt</h3><p class="value" style="color:#ef4444" id="dash-debt">0 CFA</p></div>
        </div>

        <div class="grid-layout">
            <!-- Sidebar Forms -->
            <div>
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="section-header">New Batch Arrival</div>
                    <div class="form-group">
                        <label>Batch Name (e.g. June Arrival)</label>
                        <input type="text" id="p-batch" placeholder="June 2026">
                    </div>
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="p-name">
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem">
                        <div class="form-group"><label>Dozens</label><input type="number" id="p-dozens"></div>
                        <div class="form-group"><label>Price/Dozen (₦)</label><input type="number" id="p-price-naira"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem">
                        <div class="form-group"><label>Cost (CFA)</label><input type="number" id="p-cost-cfa"></div>
                        <div class="form-group"><label>Sell Price (CFA)</label><input type="number" id="p-sell-cfa"></div>
                    </div>
                    <button onclick="saveProduct()">Save to Batch</button>
                </div>

                <div class="card">
                    <div class="section-header">Customer Ledger</div>
                    <div class="form-group"><label>Customer Name</label><input type="text" id="c-name"></div>
                    <div class="form-group"><label>Phone Number</label><input type="text" id="c-phone"></div>
                    <div class="form-group"><label>Items Bought</label><textarea id="c-items" placeholder="2 doz. Lotion, 1 doz. Soap..."></textarea></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem">
                        <div class="form-group"><label>Total Bill (CFA)</label><input type="number" id="c-total"></div>
                        <div class="form-group"><label>Amount Paid (CFA)</label><input type="number" id="c-paid"></div>
                    </div>
                    <button onclick="saveCustomer()" style="background:var(--accent)">Log Sale & Debt</button>
                </div>
            </div>

            <!-- Main Tables -->
            <div>
                <div class="section-header">
                    Inventory by Batch
                    <input type="text" id="search-batch" placeholder="Filter by batch..." style="width:200px; padding: 5px;" onkeyup="renderUI()">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Batch</th>
                                <th>Product</th>
                                <th>Stock</th>
                                <th>Total Cost (₦)</th>
                                <th>Expected (CFA)</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-body"></tbody>
                    </table>
                </div>

                <div class="section-header">Customer Debt Tracker</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Customer & Phone</th>
                                <th>Items</th>
                                <th>Total Bill</th>
                                <th>Paid</th>
                                <th>Balance</th>
                                <th>Last Paid</th>
                            </tr>
                        </thead>
                        <tbody id="ledger-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let inventory = [];
        let customers = [];

        function saveProduct() {
            const product = {
                batch: document.getElementById('p-batch').value || "General",
                name: document.getElementById('p-name').value,
                dozens: parseFloat(document.getElementById('p-dozens').value) || 0,
                priceNaira: parseFloat(document.getElementById('p-price-naira').value) || 0,
                totalNaira: (parseFloat(document.getElementById('p-dozens').value) || 0) * (parseFloat(document.getElementById('p-price-naira').value) || 0),
                sellCFA: parseFloat(document.getElementById('p-sell-cfa').value) || 0,
                totalCFA: (parseFloat(document.getElementById('p-dozens').value) || 0) * (parseFloat(document.getElementById('p-sell-cfa').value) || 0)
            };
            if(!product.name) return alert("Enter product name");
            inventory.push(product);
            renderUI();
        }

        function saveCustomer() {
            const customer = {
                name: document.getElementById('c-name').value,
                phone: document.getElementById('c-phone').value,
                items: document.getElementById('c-items').value,
                total: parseFloat(document.getElementById('c-total').value) || 0,
                paid: parseFloat(document.getElementById('c-paid').value) || 0,
                balance: (parseFloat(document.getElementById('c-total').value) || 0) - (parseFloat(document.getElementById('c-paid').value) || 0),
                date: new Date().toLocaleDateString('en-GB')
            };
            if(!customer.name) return alert("Enter customer name");
            customers.push(customer);
            renderUI();
        }

        function renderUI() {
            const filter = document.getElementById('search-batch').value.toLowerCase();
            
            // Inventory Table
            const invBody = document.getElementById('inventory-body');
            invBody.innerHTML = inventory
                .filter(p => p.batch.toLowerCase().includes(filter))
                .map(p => `
                <tr>
                    <td><span class="batch-badge">${p.batch}</span></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.dozens} doz</td>
                    <td>₦${p.totalNaira.toLocaleString()}</td>
                    <td>${p.totalCFA.toLocaleString()} CFA</td>
                </tr>
            `).join('');

            // Ledger Table
            const ledBody = document.getElementById('ledger-body');
            ledBody.innerHTML = customers.map(c => `
                <tr>
                    <td><strong>${c.name}</strong><br><small>${c.phone}</small></td>
                    <td style="font-size:0.8rem; color:var(--text-light)">${c.items}</td>
                    <td>${c.total.toLocaleString()} CFA</td>
                    <td>${c.paid.toLocaleString()} CFA</td>
                    <td style="color:${c.balance > 0 ? 'red' : 'green'}; font-weight:bold">${c.balance.toLocaleString()} CFA</td>
                    <td>${c.date}</td>
                </tr>
            `).join('');

            // Dashboard Math
            const totalNaira = inventory.reduce((s, p) => s + p.totalNaira, 0);
            const totalCFA = inventory.reduce((s, p) => s + p.totalCFA, 0);
            const totalDebt = customers.reduce((s, c) => s + c.balance, 0);

            document.getElementById('dash-naira').innerText = `₦${totalNaira.toLocaleString()}`;
            document.getElementById('dash-cfa').innerText = `${totalCFA.toLocaleString()} CFA`;
            document.getElementById('dash-debt').innerText = `${totalDebt.toLocaleString()} CFA`;
        }
    </script>
</body>
</html>
