<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuDon Executive Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --text-light: #e0e0e0;
            --danger: #ff4444;
            --success: #00c853;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--primary-gold);
            margin-bottom: 40px;
        }

        .header h1 { margin: 0; color: var(--primary-gold); letter-spacing: 4px; text-transform: uppercase; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border-top: 3px solid var(--primary-gold);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-card h3 { margin: 0; font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .stat-card p { margin: 15px 0 0; font-size: 1.8rem; font-weight: 700; }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }

        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

        .form-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .btn-save {
            background: var(--primary-gold);
            color: #000;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .table-section { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--primary-gold); border-bottom: 2px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #2a2a2a; }

        .low-stock { color: var(--danger); font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .badge { background: #333; padding: 4px 8px; border-radius: 4px; color: var(--primary-gold); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header"><h1>AKUDON COSMETICS</h1></div>

    <div class="dashboard">
        <div class="stat-card"><h3>Supply Cost (NGN)</h3><p id="dash-naira">₦0</p></div>
        <div class="stat-card"><h3>Revenue (CFA)</h3><p id="dash-cfa" style="color:var(--success)">0 CFA</p></div>
        <div class="stat-card"><h3>Customer Debt</h3><p id="dash-debt" style="color:var(--danger)">0 CFA</p></div>
    </div>

    <div class="main-grid">
        <div class="form-section">
            <h2 id="form-mode" style="color: var(--primary-gold);">Stock Entry</h2>
            <input type="text" id="p-batch" placeholder="Batch Name">
            <input type="text" id="p-name" placeholder="Product Name">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="p-dozens" placeholder="Dozens">
                <input type="number" id="p-sold" placeholder="Sold" value="0">
            </div>
            <input type="number" id="p-price-naira" placeholder="Cost per Dozen (₦)">
            <input type="number" id="p-sell-cfa" placeholder="Selling Price (CFA)">
            <button class="btn-save" onclick="saveProduct()">UPDATE TERMINAL</button>

            <hr style="border: 1px solid #333; margin: 20px 0;">
            
            <h2 style="color: var(--primary-gold);">Customer Transaction</h2>
            <input type="text" id="c-name" placeholder="Customer Name">
            <input type="number" id="c-total" placeholder="Total Bill (CFA)">
            <input type="number" id="c-paid" placeholder="Amount Paid (CFA)">
            <button class="btn-save" style="background:#555; color:white;" onclick="saveCustomer()">UPDATE LEDGER</button>
        </div>

        <div class="content">
            <div class="table-section">
                <h2>Live Inventory</h2>
                <table>
                    <thead><tr><th>Batch</th><th>Product</th><th>Total</th><th>Stock Left</th><th>Action</th></tr></thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
            <div class="table-section">
                <h2>Customer Ledger</h2>
                <table>
                    <thead><tr><th>Customer</th><th>Total Bill</th><th>Paid</th><th>Balance</th><th>Action</th></tr></thead>
                    <tbody id="ledger-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
